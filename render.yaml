
# Render Blueprint: two services from one repository.
# Dashboard -> New -> Blueprint -> select this repository.
#
# After deployment:
# 1. Set the API URL in staffium-frontend/frontend-v2/assets/js/config.js.
# 2. Update the CSP connect-src directive if your API URL differs.
# 3. Set FRONTEND_ORIGIN to your deployed frontend URL.
# 4. Configure all secrets in the Render dashboard, not in Git.

services:
  # FastAPI backend
  - type: web
    name: staffium-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5', cache_dir='./.models')"
    # One worker: the in-memory rate limiter and background worker live in this process.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*" --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDINGS_PROVIDER
        value: fastembed
      - key: EMBEDDING_CACHE_DIR
        value: ./.models
      - key: AWS_REGION
        value: ap-south-1
      - key: BEDROCK_MODEL_ID
        value: apac.amazon.nova-lite-v1:0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: EMAIL_ENABLED
        sync: false
      - key: SES_FROM_EMAIL
        sync: false

  # Static frontend
  - type: web
    name: staffium-web
    runtime: static
    rootDir: staffium-frontend/frontend-v2
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://staffium-api.onrender.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
